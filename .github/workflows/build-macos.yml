# Monta o executável de Mac — um para cada processador.
#
# Um binário de Apple Silicon não roda em Mac Intel: não há Rosetta nessa
# direção. E `universal2` do PyInstaller depende de todas as bibliotecas terem
# wheel universal, o que o pdfminer e companhia não têm. Então saem dois
# pacotes, e quem entrega escolhe pelo "Sobre este Mac" da pessoa.
name: Executável Mac

on:
  push:
    branches: [main]
    # Etiquetar uma versão publica o pacote na release — é o que dá um endereço
    # fixo para baixar, em vez do artifact do Actions, que expira em 90 dias,
    # baixa embrulhado num zip a mais e não aparece para quem só procura onde
    # está o programa.
    #
    #     git tag v0.2.0 && git push origin v0.2.0
    tags: ["v*"]
  workflow_dispatch:

# `gh release upload` escreve no repositório; o token padrão do Actions só lê.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # O label `macos-13` foi aposentado: o job fica na fila para sempre,
          # sem runner e sem erro. `macos-15-intel` é o Intel que restou.
          - runner: macos-15-intel
            arquitetura: Intel
          - runner: macos-latest # Apple Silicon
            arquitetura: Apple-Silicon

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar a ferramenta e o PyInstaller
        run: |
          python -m pip install --upgrade pip

          # O `cryptography` (exigido pelo pdfminer, que o pdfplumber usa) não
          # publica mais wheel para macOS Intel. Sem isto o pip compila do
          # fonte e amarra o binário ao OpenSSL do Homebrew, em
          # /usr/local/opt/openssl@3 — que é mais novo que o libssl que vem
          # junto com o Python. Os dois arquivos se chamam `libssl.3.dylib`, e
          # como só um cabe na raiz do pacote, o PyInstaller mantém o do Python
          # e religa o cryptography nele. Aí falta o símbolo
          # `_SSL_get0_group_name` e o leitor de PDF morre — só no Intel, e só
          # no executável, nunca em desenvolvimento.
          #
          # Exigir wheel faz o pip recuar até a versão mais nova que ainda tem
          # uma, e essas trazem o OpenSSL embutido: some a colisão e some a
          # dependência de um caminho do Homebrew que não existe na máquina de
          # quem recebe.
          pip install --only-binary=:all: cryptography

          pip install .
          pip install pyinstaller

      # No Intel, o leitor de PDF quebrou com "Symbol not found:
      # _SSL_get0_group_name": o `cryptography` (exigido pelo pdfminer) tinha
      # sido ligado a um OpenSSL mais novo que o libssl que o PyInstaller
      # empacotou. Este passo mostra contra o que cada coisa está ligada, para
      # a correção ser dirigida e não chute.
      - name: Diagnóstico do OpenSSL
        run: |
          echo "== cryptography =="
          pip show cryptography | head -3
          SO=$(python -c "import cryptography.hazmat.bindings._rust as m; print(m.__file__)")
          echo "$SO"
          otool -L "$SO" || true
          echo "== _ssl do próprio Python =="
          SSL=$(python -c "import _ssl; print(_ssl.__file__)")
          otool -L "$SSL" || true
          python -c "import ssl; print('OpenSSL do Python:', ssl.OPENSSL_VERSION)"
          echo "== libssl visíveis na máquina =="
          ls -l /usr/local/opt/openssl@3/lib/libssl*.dylib 2>/dev/null || true
          ls -l /opt/homebrew/opt/openssl@3/lib/libssl*.dylib 2>/dev/null || true

      - name: Montar o executável
        run: pyinstaller --clean --noconfirm distribuir/npd-tool.spec

      - name: Conferir que o executável responde
        run: ./dist/npd-tool --help

      # O PyInstaller pode deixar o pdfminer para trás — o pdfplumber o carrega
      # por nome, em tempo de execução. Sem esta conferência, o executável sai,
      # roda com xlsx e só quebra no primeiro PDF, meses depois.
      - name: Conferir que todos os leitores foram empacotados
        run: ./dist/npd-tool versao

      - name: Conferir a arquitetura do binário
        run: |
          file dist/npd-tool
          esperado="${{ matrix.arquitetura }}"
          arquitetura=$(file -b dist/npd-tool)
          if [ "$esperado" = "Intel" ] && ! echo "$arquitetura" | grep -q "x86_64"; then
            echo "::error::esperava binário Intel, saiu: $arquitetura"
            exit 1
          fi
          if [ "$esperado" = "Apple-Silicon" ] && ! echo "$arquitetura" | grep -q "arm64"; then
            echo "::error::esperava binário arm64, saiu: $arquitetura"
            exit 1
          fi

      # A mensagem que a pessoa vê quando clica no atalho na pasta errada é a
      # única coisa entre ela e desistir.
      - name: Conferir a mensagem de pasta vazia
        run: |
          mkdir -p teste-vazio && cd teste-vazio
          set +e
          saida=$(../dist/npd-tool abrir 2>&1)
          codigo=$?
          set -e
          echo "$saida"
          echo "código de saída: $codigo"
          if ! echo "$saida" | grep -q "Coloque a planilha NPD"; then
            echo "::error::a mensagem mudou — quem clicar no atalho na pasta errada fica sem saber o que fazer"
            exit 1
          fi
          if [ "$codigo" -ne 2 ]; then
            echo "::error::esperava código 2 (recusa com motivo), veio $codigo"
            exit 1
          fi

      - name: Montar a pasta de entrega
        run: |
          pasta="Ferramenta NPD"
          mkdir -p "$pasta/programa" "$pasta/cotações"
          cp dist/npd-tool "$pasta/programa/"
          cp distribuir/macos/*.command "$pasta/"
          chmod +x "$pasta"/*.command "$pasta/programa/npd-tool"
          cp COMO-USAR.md "$pasta/"
          cp distribuir/LEIA-ME-mac.txt "$pasta/LEIA-ME.txt"
          # zip não guarda pasta vazia, e a subpasta precisa existir
          echo "Copie para esta pasta os arquivos de cotação (.xlsx ou .pdf) e depois clique em '1 - Abrir cotações'." \
            > "$pasta/cotações/coloque aqui os arquivos de cotação.txt"

      # O upload-artifact não preserva a permissão de execução, e um .command
      # sem ela não abre com clique duplo. Zipar aqui preserva.
      - name: Compactar preservando as permissões
        run: zip -qry "Ferramenta-NPD-Mac-${{ matrix.arquitetura }}.zip" "Ferramenta NPD"

      - uses: actions/upload-artifact@v4
        with:
          name: Ferramenta-NPD-Mac-${{ matrix.arquitetura }}
          path: Ferramenta-NPD-Mac-${{ matrix.arquitetura }}.zip
          if-no-files-found: error

      # Só em etiqueta. Num push comum de `main` não há release para anexar, e
      # falhar aqui derrubaria uma montagem que deu certo.
      - name: Publicar na release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # As quatro montagens correm juntas e qualquer uma pode chegar
          # primeiro. `create` falha para as outras três porque a release já
          # existe — e é exatamente isso que se quer, então o erro é engolido.
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes "Pacotes prontos abaixo. Windows: Instalar-Ferramenta-NPD.exe. Mac com chip M: Ferramenta-NPD-Mac-Apple-Silicon.dmg. Os arquivos Ferramenta-NPD-* são a versão de terminal." \
            --verify-tag || true
          gh release upload "${{ github.ref_name }}" "Ferramenta-NPD-Mac-${{ matrix.arquitetura }}.zip" --clobber
