# Monta o executável de Windows numa máquina Windows.
#
# Existe porque o PyInstaller não faz build cruzado: um .exe só sai de um
# Windows. Como o desenvolvimento acontece num Mac, o GitHub empresta a máquina.
#
# O resultado é a pasta pronta para entregar: os três atalhos, o executável e
# as pastas de trabalho. Baixa em Actions -> a execução -> Artifacts.
name: Executável Windows

on:
  push:
    branches: [main]
    # Etiquetar uma versão publica o pacote na release — é o que dá um endereço
    # fixo para baixar, em vez do artifact do Actions, que expira em 90 dias,
    # baixa embrulhado num zip a mais e não aparece para quem só procura onde
    # está o programa.
    #
    #     git tag v0.2.0 && git push origin v0.2.0
    tags: ["v*"]
  workflow_dispatch: # permite rodar na mão, pelo botão do GitHub

# `gh release upload` escreve no repositório; o token padrão do Actions só lê.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar a ferramenta e o PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller

      - name: Montar o executável
        run: pyinstaller --clean --noconfirm distribuir/npd-tool.spec

      - name: Conferir que o executável responde
        run: dist\npd-tool.exe --help

      # O empacotamento é o passo que falha em silêncio: o PyInstaller pode
      # deixar de fora o pdfminer, que o pdfplumber carrega por nome. O
      # executável sai, roda com xlsx e só quebra no primeiro PDF — na mão do
      # gestor, meses depois. `versao` importa cada leitor e sai com erro se
      # faltar algum.
      - name: Conferir que todos os leitores foram empacotados
        run: dist\npd-tool.exe versao

      # A outra prova que importa: sem planilha na pasta, a ferramenta tem que
      # recusar com uma frase que diga o que fazer — é essa mensagem que a
      # pessoa vê quando clica no atalho na pasta errada.
      - name: Conferir a mensagem de pasta vazia
        shell: pwsh
        run: |
          # O pwsh do Actions roda com ErrorActionPreference=Stop, e aí qualquer
          # linha em stderr de um programa externo vira erro fatal. Aqui stderr
          # é a saída esperada, não uma falha.
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false

          New-Item -ItemType Directory -Force -Path teste-vazio | Out-Null
          Set-Location teste-vazio
          $saida = & ..\dist\npd-tool.exe abrir *>&1 | Out-String
          $codigo = $LASTEXITCODE
          Write-Host $saida
          Write-Host "código de saída: $codigo"

          if ($saida -notmatch "Coloque a planilha NPD") {
            Write-Host "::error::a mensagem mudou — quem clicar no atalho na pasta errada fica sem saber o que fazer"
            exit 1
          }
          if ($codigo -ne 2) {
            Write-Host "::error::esperava código 2 (recusa com motivo), veio $codigo"
            exit 1
          }
          exit 0

      - name: Montar a pasta de entrega
        shell: pwsh
        run: |
          $pasta = "Ferramenta NPD"
          New-Item -ItemType Directory -Force -Path "$pasta\programa" | Out-Null
          New-Item -ItemType Directory -Force -Path "$pasta\cotacoes" | Out-Null
          Copy-Item dist\npd-tool.exe "$pasta\programa\"
          Copy-Item "distribuir\windows\*.bat" "$pasta\"
          Copy-Item COMO-USAR.md "$pasta\"
          Copy-Item distribuir\LEIA-ME.txt "$pasta\" -ErrorAction SilentlyContinue
          # a pasta de cotações precisa existir no zip, e zip não guarda pasta vazia
          Set-Content -Path "$pasta\cotacoes\coloque aqui os arquivos de cotacao.txt" `
            -Value "Copie para esta pasta os arquivos de cotacao (.xlsx ou .pdf) e depois clique em '1 - Abrir cotacoes'."

      # Compactar aqui, e não deixar o upload-artifact fazer isso, é o que
      # permite anexar UM arquivo na release. O artifact do Actions embrulha a
      # pasta num zip próprio, que só existe do lado de lá.
      - name: Compactar a pasta de entrega
        shell: pwsh
        run: Compress-Archive -Path "Ferramenta NPD" -DestinationPath "Ferramenta-NPD-Windows.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Ferramenta-NPD-Windows
          path: Ferramenta-NPD-Windows.zip
          if-no-files-found: error

      # Só em etiqueta. Num push comum de `main` não há release para anexar, e
      # falhar aqui derrubaria uma montagem que deu certo.
      - name: Publicar na release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # As quatro montagens correm juntas e qualquer uma pode chegar
          # primeiro. `create` falha para as outras três porque a release já
          # existe — e é exatamente isso que se quer, então o erro é engolido.
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes "Pacotes prontos abaixo. Windows: Instalar-Ferramenta-NPD.exe. Mac com chip M: Ferramenta-NPD-Mac-Apple-Silicon.dmg. Os arquivos Ferramenta-NPD-* são a versão de terminal." \
            --verify-tag || true
          gh release upload "${{ github.ref_name }}" "Ferramenta-NPD-Windows.zip" --clobber
