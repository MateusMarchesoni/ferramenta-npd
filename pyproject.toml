[project]
name = "npd-tool"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "openpyxl>=3.1",   # leitura de xlsx e das cotações; NUNCA para salvar a NPD
    "pdfplumber>=0.11",  # cotações em PDF (traz pdfminer.six, pypdfium2 e Pillow)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
npd-tool = "npd_tool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
